name: Dependabot bun.lock sync

# Why this exists
# ---------------
# Dependabot's npm-ecosystem updates bump package.json (+ package-lock.json) but
# never regenerate the committed bun.lock. The Dockerfile runs
#   bun install --frozen-lockfile
# so the (non-required) "Docker Build Test" CI job fails on every such PR with
#   "lockfile had changes, but lockfile is frozen"
# while the full-checkout jobs stay green. This recurred on PR #94 and is the
# sequel to #82/#83, which first committed bun.lock and made --frozen-lockfile
# actually enforce.
#
# This workflow regenerates bun.lock on Dependabot PRs and pushes it back so the
# PR self-heals instead of needing a manual `bun install` + push.
#
# Why a GitHub App token instead of GITHUB_TOKEN
# ----------------------------------------------
# A push authenticated with the default GITHUB_TOKEN does NOT trigger new
# workflow runs (GitHub recursion-prevention). The fix commit would then have no
# Lint / Type Check / Test runs — and those ARE required status checks on main —
# so the PR would stick on "Expected — waiting for status". An App installation
# token is a distinct identity, so its push DOES re-trigger CI: required checks
# and Docker Build Test re-run and go green, and the already-armed native
# auto-merge (allow_auto_merge is enabled) completes server-side.
#
# Loop safety — two independent guards
# ------------------------------------
#   1. Actor gate: the job only runs on commits authored by dependabot[bot].
#      Our push is authored by the App, so the `synchronize` run it triggers is
#      gated out and never re-fires this workflow.
#   2. Change gate: we only commit/push when bun.lock actually changed. A re-run
#      on an already-synced lockfile is a no-op.
# Either guard alone breaks the loop; together they make recursion impossible.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

# One in-flight sync per PR; newer pushes supersede older runs.
concurrency:
  group: dependabot-bun-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-lockfile:
    name: Sync bun.lock
    runs-on: ubuntu-latest
    # Same-repo Dependabot PRs only. Dependabot branches live in this repo, so
    # head.repo == this repo; the explicit check keeps fork PRs (which can never
    # receive a write-scoped token push anyway) out.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read  # checkout/push use the App token below, not GITHUB_TOKEN
    steps:
      - name: Mint App token (its push re-triggers CI)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.LOCKFILE_APP_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_PRIVATE_KEY }}
          permission-contents: write  # least privilege: only what the push needs

      - name: Checkout PR head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Regenerate bun.lock from package.json
        run: bun install

      - name: Commit and push bun.lock if it changed
        # Untrusted inputs (github.head_ref, app-slug) are passed via env and
        # referenced only as quoted shell variables — never interpolated into
        # the script body — to avoid workflow command injection.
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already in sync with package.json — nothing to push."
            exit 0
          fi
          echo "bun.lock drifted from package.json — pushing refreshed lockfile."
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock with package.json [dependabot]"
          git push origin "HEAD:${HEAD_REF}"
